# erpcraft in production: the server and its PostgreSQL, data on a volume,
# settings from an env file. See docs/ops/self-hosting.md.
#
#   cp deploy/erpcraft.env.example deploy/erpcraft.env   # then edit it
#   docker compose -f deploy/compose.prod.yml --env-file deploy/erpcraft.env up -d
#
# The server is published on 127.0.0.1:8600 only: put a reverse proxy with
# TLS in front of it (deploy/Caddyfile.example).
name: ${COMPOSE_PROJECT_NAME:-erpcraft}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erpcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-erpcraft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  erpcraft:
    image: ${ERPCRAFT_IMAGE:-erpcraft:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ERPCRAFT_ENV_FILE:-erpcraft.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erpcraft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erpcraft}
      ERPCRAFT_BIND: 0.0.0.0:8600
    ports:
      - "${ERPCRAFT_PUBLISH:-127.0.0.1:8600}:8600"
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
