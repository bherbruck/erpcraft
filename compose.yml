# Development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    # Each integration test uses its own database and pool.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: erpcraft
      POSTGRES_PASSWORD: erpcraft
      POSTGRES_DB: erpcraft
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erpcraft"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
