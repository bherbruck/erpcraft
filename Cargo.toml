[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
erpcraft-core = { path = "crates/erpcraft-core" }
erpcraft-db = { path = "crates/erpcraft-db" }
erpcraft-kernel = { path = "crates/erpcraft-kernel" }
erpcraft-gl = { path = "crates/erpcraft-gl" }
erpcraft-stock = { path = "crates/erpcraft-stock" }
erpcraft-openitems = { path = "crates/erpcraft-openitems" }
erpcraft-tax = { path = "crates/erpcraft-tax" }
erpcraft-party = { path = "crates/erpcraft-party" }
erpcraft-api = { path = "crates/erpcraft-api" }
erpcraft-auth = { path = "crates/erpcraft-auth" }
erpcraft-mcp = { path = "crates/erpcraft-mcp" }
erpcraft-rules = { path = "crates/erpcraft-rules" }
erpcraft-accounting = { path = "modules/accounting" }
erpcraft-inventory = { path = "modules/inventory" }
erpcraft-manufacturing = { path = "modules/manufacturing" }
erpcraft-purchasing = { path = "modules/purchasing" }
erpcraft-payments = { path = "modules/payments" }
erpcraft-sales = { path = "modules/sales" }
erpcraft-webhooks = { path = "modules/webhooks" }
erpcraft-printing = { path = "modules/printing" }
erpcraft-setup = { path = "modules/setup" }
erpcraft-banking = { path = "modules/banking" }
erpcraft-assets = { path = "modules/assets" }
erpcraft-einvoice = { path = "modules/einvoice" }

# Used only by erpcraft-printing: every rendered page and every saved
# template goes through it. Built on html5ever, a spec-compliant parser.
ammonia = "4.2"
argon2 = "0.5"
# Used only by erpcraft-banking, to read bank statement exports.
csv = "1.4"
async-trait = "0.1"
# In tests only, to make signing keys for a stand-in identity provider.
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.23"
# Used only by erpcraft-rules. Nothing else may depend on the rule engine.
cel = { version = "0.16", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# Used only by erpcraft-printing, for print templates. No loader feature:
# a template cannot read a file. `fuel` bounds how long one may run.
# Used only by erpcraft-banking, for ISO 20022 camt.053 statements. It
# resolves no external entity and reads no DTD.
quick-xml = "0.42"
# Used only by erpcraft-einvoice, to read the XML embedded in a ZUGFeRD /
# Factur-X PDF; the PDF is parsed, never rendered. Inflating is done with
# flate2 under a size limit, not by lopdf.
lopdf = { version = "0.47", default-features = false }
flate2 = "1"
minijinja = { version = "3.1", default-features = false, features = ["builtins", "fuel", "serde"] }
hmac = "0.12"
http-body-util = "0.1"
# The aws-lc-rs backend is the one the TLS stack already brings in.
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rust_decimal = "1"
# `preserve_order` publishes a struct's properties in the order they are
# declared, so forms ask in that order. It turns on serde_json's
# `preserve_order` too: JSON objects keep the order of their keys, so
# anything that hashes or compares JSON text must not rely on sorted keys.
schemars = { version = "1", features = ["uuid1", "chrono04", "rust_decimal1", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = [
    "derive",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Password hashing is far too slow unoptimized; this keeps tests quick.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
